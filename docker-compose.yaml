name: 'pop-compose'

services:

  iam:
    container_name: popiam
    image: quay.io/keycloak/keycloak:24.0.4
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://popdb:5432/keycloak
      KC_DB_USERNAME: localhost
      KC_DB_PASSWORD: root
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: 
      - start-dev
    depends_on:
      - db
    ports:
      - 8080:8080

  db:
    container_name: popdb
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: localhost
      POSTGRES_PASSWORD: root
    volumes:
      - popdb:/var/lib/postgresql/data
    ports:
      - 5432:5432

  catalog-db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: reviewverse_catalog
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-local-development-only}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8
    ports:
      - "127.0.0.1:${CATALOG_DB_PORT:-55432}:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

  catalog-db-tests:
    image: postgres:16-bookworm
    profiles: [catalog-tests]
    environment:
      POSTGRES_DB: reviewverse_catalog_tests
      POSTGRES_USER: ${CATALOG_TEST_DB_USER:-catalog_tests}
      POSTGRES_PASSWORD: ${CATALOG_TEST_DB_PASSWORD:-local-tests-only}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.utf8
    ports:
      - "127.0.0.1:${CATALOG_TEST_DB_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  popdb:
  catalog-data:
